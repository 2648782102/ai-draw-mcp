<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AI Draw MCP 人类与 AI 共享项目画布</title>
<desc id="desc">AI 通过 MCP 扫描项目并展示项目图，人类在同一画布编辑结构、选择范围和添加对象批注，AI 读取并回应。代码变更仍须完整 diff、人工批准和一次性确认号。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7"/>
  </marker>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1321"/><stop offset="1" stop-color="#17243c"/></linearGradient>
</defs>
<rect width="1200" height="520" fill="url(#bg)"/>
<text x="600" y="54" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" text-anchor="middle">AI Draw MCP · 人类与 AI 共享的项目画布</text>
<text x="600" y="84" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="400" text-anchor="middle">本机优先 · 共享图形上下文 · MCP 接入 · 人工批准</text>
<rect x="60" y="135" width="200" height="92" rx="12" fill="#162842" stroke="#2b3a55" stroke-width="1.5"/><text x="160" y="170" fill="#7aa2f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="middle">AI</text><text x="160" y="198" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" text-anchor="middle">scan_project</text>
<rect x="310" y="135" width="200" height="92" rx="12" fill="#162842" stroke="#2b3a55" stroke-width="1.5"/><text x="410" y="170" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="middle">共享项目图</text><text x="410" y="198" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" text-anchor="middle">结构 · 证据 · 修订</text>
<rect x="560" y="135" width="200" height="92" rx="12" fill="#213252" stroke="#2b3a55" stroke-width="1.5"/><text x="660" y="170" fill="#9ece6a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="middle">人类</text><text x="660" y="198" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">编辑 · 选择 · 对象批注</text>
<rect x="810" y="135" width="200" height="92" rx="12" fill="#162842" stroke="#2b3a55" stroke-width="1.5"/><text x="910" y="170" fill="#7aa2f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="middle">AI</text><text x="910" y="198" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">读取 · 解释 · 更新</text>
<rect x="310" y="330" width="200" height="92" rx="12" fill="#2b2350" stroke="#2b3a55" stroke-width="1.5"/><text x="410" y="365" fill="#bb9af7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="middle">变更提案</text><text x="410" y="393" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">逐行 diff + 影响摘要</text>
<rect x="560" y="330" width="200" height="92" rx="12" fill="#203b32" stroke="#2b3a55" stroke-width="1.5"/><text x="660" y="365" fill="#9ece6a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="middle">人类批准</text><text x="660" y="393" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">一次性确认号</text>
<rect x="810" y="330" width="200" height="92" rx="12" fill="#162842" stroke="#2b3a55" stroke-width="1.5"/><text x="910" y="365" fill="#7aa2f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="middle">AI</text><text x="910" y="393" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">apply_visual_proposal</text>
<path d="M 260 181 C 305 181, 265 181, 310 181" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 510 181 C 555 181, 515 181, 560 181" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 760 181 C 805 181, 765 181, 810 181" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 910 227 C 955 227, 865 285, 910 285" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 810 330 C 855 330, 715 330, 760 330" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 560 330 C 605 330, 465 330, 510 330" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 310 330 C 355 330, 215 330, 260 330" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 160 330 C 205 330, 115 227, 160 227" fill="none" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="478" fill="#f0a868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="middle">画布沟通 ≠ 项目写入授权 · 完整 diff 与人工批准后才可应用提案</text>
</svg>