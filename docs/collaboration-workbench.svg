<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">协作工作台概念预览</title>
<desc id="desc">三栏工作台：项目图节点编辑、活动时间线与节点批注线程、变更提案与人工批准。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7"/>
  </marker>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1321"/><stop offset="1" stop-color="#17243c"/></linearGradient>
</defs>
<rect width="1200" height="620" fill="url(#bg)"/>
<rect x="24" y="24" width="1152" height="572" rx="16" fill="#111a2c" stroke="#2b3a55" stroke-width="1.5"/>
<rect x="24" y="24" width="1152" height="48" rx="16" fill="#18243a"/>
<text x="48" y="54" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" text-anchor="start">双向协作工作台</text>
<text x="260" y="54" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">session · revision · workspace</text>
<text x="1148" y="54" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="end">💬 协作</text>
<rect x="40" y="88" width="360" height="492" rx="10" fill="#0e1727" stroke="#2b3a55"/>
<rect x="40" y="88" width="360" height="34" rx="10" fill="#17243a"/>
<text x="58" y="110" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="start">项目图 · 节点编辑</text>
<rect x="58" y="138" width="150" height="48" rx="12" fill="#1d3152" stroke="#2b3a55" stroke-width="1.5"/><text x="133" y="168" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">src / tools</text>
<rect x="238" y="138" width="145" height="48" rx="12" fill="#1d3152" stroke="#2b3a55" stroke-width="1.5"/><text x="310" y="168" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">src / domain</text>
<rect x="148" y="220" width="150" height="48" rx="12" fill="#203b32" stroke="#2b3a55" stroke-width="1.5"/><text x="223" y="250" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">shared / 公共层</text>
<path d="M 133 186 L 223 220" stroke="#7aa2f7" stroke-width="2" fill="none"/>
<path d="M 310 186 L 223 220" stroke="#7aa2f7" stroke-width="2" fill="none"/>
<text x="58" y="310" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">+ 节点   + 连线   保存图形</text>
<text x="58" y="345" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">选中节点后批注会绑定到它</text>
<text x="58" y="380" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="400" text-anchor="start">图形修订通过 WebSocket 同步</text>
<rect x="416" y="88" width="360" height="492" rx="10" fill="#0e1727" stroke="#2b3a55"/>
<rect x="416" y="88" width="360" height="34" rx="10" fill="#17243a"/>
<text x="434" y="110" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="start">时间线 · 对话 · 批注线程</text>
<text x="434" y="144" fill="#f0a868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">活动时间线 · 12 个派生事件 · 下一棒 AI</text>
<rect x="434" y="158" width="324" height="42" rx="12" fill="#17243a" stroke="#2b3a55" stroke-width="1.5"/><text x="452" y="184" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="500" text-anchor="start">批注 → 回复 → 提案 → 批准 → 应用</text>
<rect x="434" y="212" width="324" height="42" rx="12" fill="#17243a" stroke="#2b3a55" stroke-width="1.5"/><text x="452" y="238" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">消息 / 线程状态 / 提案生命周期</text>
<rect x="434" y="278" width="324" height="96" rx="12" fill="#213252" stroke="#2b3a55" stroke-width="1.5"/><text x="452" y="304" fill="#9ece6a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">@ shared · 待讨论 · 等待 AI 回复</text>
<text x="452" y="330" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="start">把 utils 抽成公共层</text>
<text x="452" y="354" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">AI：我会在提案里更新 import</text>
<text x="452" y="392" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">回复这条批注，AI 会读取…</text>
<text x="434" y="442" fill="#f0a868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">解决 / 重开只是对话状态</text>
<text x="434" y="466" fill="#f0a868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">不等于批准变更</text>
<rect x="792" y="88" width="368" height="492" rx="10" fill="#0e1727" stroke="#2b3a55"/>
<rect x="792" y="88" width="368" height="34" rx="10" fill="#17243a"/>
<text x="810" y="110" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="start">变更提案 · 人工确认</text>
<rect x="810" y="138" width="332" height="74" rx="12" fill="#1d2f4c" stroke="#2b3a55" stroke-width="1.5"/><text x="828" y="164" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="start">提案：目录迁移与 import 更新</text>
<text x="828" y="188" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">rev 4 · hash 8f3c… · 2 files</text>
<rect x="810" y="226" width="332" height="54" rx="12" fill="#17243a" stroke="#2b3a55" stroke-width="1.5"/><text x="828" y="258" fill="#9ece6a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">2 files · +18 / −4 lines · safe paths only</text>
<rect x="810" y="294" width="332" height="126" rx="12" fill="#111c30" stroke="#2b3a55" stroke-width="1.5"/><text x="828" y="320" fill="#d8e2f5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="start">查看逐行差异</text>
<text x="828" y="348" fill="#ff9b95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">- import { x } from "../utils"</text>
<text x="828" y="372" fill="#9be29f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">+ import { x } from "../shared"</text>
<text x="828" y="400" fill="#f0a868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" text-anchor="start">批准只签发一次性凭据，不写文件</text>
<rect x="828" y="442" width="140" height="38" rx="12" fill="#203b32" stroke="#2b3a55" stroke-width="1.5"/><text x="898" y="466" fill="#9ece6a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">批准</text>
<rect x="986" y="442" width="140" height="38" rx="12" fill="#3a2028" stroke="#2b3a55" stroke-width="1.5"/><text x="1056" y="466" fill="#ff9b95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" text-anchor="middle">拒绝</text>
<text x="810" y="520" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">确认号 → apply_visual_proposal</text>
<text x="810" y="546" fill="#93a4c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="400" text-anchor="start">失败自动回滚</text>
</svg>