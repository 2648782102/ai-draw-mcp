<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Draw MCP — Diagram Preview</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --text-muted: #8b8fa3;
      --accent: #6c72cb;
      --accent-hover: #8086d6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #6c72cb, #cb69c1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }
    .status .dot.offline { background: #f44336; }
    .container {
      display: flex;
      height: calc(100vh - 57px);
    }
    .sidebar {
      width: 280px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      padding: 12px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .diagram-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .diagram-item:hover, .diagram-item.active {
      background: var(--surface);
    }
    .diagram-item .name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .diagram-item .meta {
      font-size: 11px;
      color: var(--text-muted);
    }
    .diagram-item .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      background: var(--accent);
      color: #fff;
      margin-right: 6px;
    }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    .main svg {
      max-width: 100%;
      max-height: 100%;
    }
    .empty {
      color: var(--text-muted);
      text-align: center;
    }
    .empty p { margin-top: 8px; font-size: 14px; }
    .toolbar {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    .toolbar button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    .toolbar button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Draw MCP</h1>
    <div class="status">
      <span class="dot" id="wsStatus"></span>
      <span id="wsLabel">Connecting...</span>
    </div>
  </header>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-title">Diagrams</div>
      <div id="diagramList"></div>
    </aside>
    <main class="main" id="viewer">
      <div class="empty">
        <p>No diagrams yet.<br/>AI will generate them during conversation.</p>
      </div>
    </main>
  </div>
  <div class="toolbar">
    <button id="btnDownloadSvg">Download SVG</button>
    <button id="btnDownloadPng">Download PNG</button>
  </div>

  <script>
    const API = location.origin;
    let currentId = null;

    async function loadList() {
      try {
        const res = await fetch(`${API}/api/diagrams`);
        const diagrams = await res.json();
        const list = document.getElementById('diagramList');
        list.innerHTML = '';
        for (const d of diagrams) {
          const el = document.createElement('div');
          el.className = 'diagram-item' + (d.id === currentId ? ' active' : '');
          el.innerHTML = `
            <div class="name">${d.title}</div>
            <div class="meta"><span class="badge">${d.type}</span>${new Date(d.createdAt).toLocaleString()}</div>
          `;
          el.onclick = () => showDiagram(d.id);
          list.appendChild(el);
        }
        if (diagrams.length > 0 && !currentId) {
          showDiagram(diagrams[0].id);
        }
      } catch {}
    }

    async function showDiagram(id) {
      currentId = id;
      try {
        const res = await fetch(`${API}/api/diagram/${id}/svg`);
        const svg = await res.text();
        document.getElementById('viewer').innerHTML = svg;
        document.querySelectorAll('.diagram-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.diagram-item').forEach((el, i) => {
          if (el.querySelector('.name')?.textContent) el.classList.toggle('active', false);
        });
        loadList();
      } catch {}
    }

    document.getElementById('btnDownloadSvg').onclick = () => {
      if (currentId) window.open(`${API}/api/diagram/${currentId}/svg?download=1`);
    };
    document.getElementById('btnDownloadPng').onclick = () => {
      if (currentId) window.open(`${API}/api/diagram/${currentId}/png?download=1`);
    };

    // WebSocket for live updates
    function connectWs() {
      const ws = new WebSocket(`ws://${location.host}/ws`);
      const dot = document.getElementById('wsStatus');
      const label = document.getElementById('wsLabel');
      ws.onopen = () => { dot.classList.remove('offline'); label.textContent = 'Live'; };
      ws.onclose = () => { dot.classList.add('offline'); label.textContent = 'Offline'; setTimeout(connectWs, 3000); };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'diagram_added') {
          loadList();
          showDiagram(msg.id);
        }
      };
    }

    loadList();
    connectWs();
  </script>
</body>
</html>
