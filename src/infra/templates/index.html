<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Draw MCP — Live Editor</title>
  <script src="/vendor/mermaid-dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22252f;
      --border: #2e3140;
      --text: #e1e4ed;
      --text-muted: #6b7084;
      --accent: #6c72cb;
      --accent2: #cb69c1;
      --green: #4caf50;
      --red: #f44336;
      --orange: #ff9800;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* ── Header ── */
    .header {
      height: 40px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .header .brand { font-size: 13px; font-weight: 600; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .header .dot.offline { background: var(--red); }
    .toolbar { display: flex; gap: 4px; align-items: center; }
    .toolbar select, .toolbar button {
      height: 26px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 11px; cursor: pointer;
    }
    .toolbar button:hover { background: var(--accent); border-color: var(--accent); }
    .toolbar .btn-icon { width: 26px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    /* ── Main Layout ── */
    .main { display: flex; height: calc(100vh - 40px); }

    /* ── Sidebar: diagram list ── */
    .sidebar {
      width: 200px; border-right: 1px solid var(--border); flex-shrink: 0;
      display: flex; flex-direction: column; background: var(--surface);
      position: relative;
    }
    .sidebar-head { padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .sidebar-list { flex: 1; overflow-y: auto; }
    /* Sidebar resize handle */
    .sidebar-resize {
      position: absolute; right: -2px; top: 0; bottom: 0; width: 4px;
      cursor: col-resize; background: transparent; z-index: 5; transition: background .15s;
    }
    .sidebar-resize:hover { background: var(--accent); }
    .sidebar.collapsed .sidebar-resize { display: none; }
    .sidebar-item {
      padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer;
      font-size: 12px; transition: background .1s;
    }
    .sidebar-item:hover, .sidebar-item.active { background: var(--surface2); }
    .sidebar-item .name { font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-item .meta { font-size: 10px; color: var(--text-muted); }
    .sidebar-item .badge { display: inline-block; padding: 0 4px; border-radius: 3px; font-size: 9px; background: var(--accent); color: #fff; margin-right: 4px; }

    /* ── Editor + Preview split ── */
    .workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .panes { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .pane-header {
      height: 30px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .divider {
      width: 4px; background: var(--border); cursor: col-resize; flex-shrink: 0;
      transition: background .15s;
    }
    .divider:hover { background: var(--accent); }

    /* Code editor */
    .editor-wrap { flex: 1; position: relative; }
    #codeEditor {
      width: 100%; height: 100%; resize: none; border: none; outline: none;
      background: var(--bg); color: #c9d1d9; padding: 12px;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px; line-height: 1.6; tab-size: 2;
    }

    /* Diagram preview */
    .preview-wrap {
      flex: 1; overflow: hidden; position: relative;
      background: #ffffff;
    }
    .preview-wrap.dark-bg { background: var(--bg); }
    #diagramRender {
      position: absolute; top: 0; left: 0;
      transform-origin: 0 0;
      padding: 20px;
    }
    /* Transparent overlay captures all mouse events — prevents SVG from stealing drag/scroll */
    #panOverlay {
      position: absolute; inset: 0; z-index: 10;
      cursor: grab;
    }
    #panOverlay.panning { cursor: grabbing; }
    #diagramRender svg { display: block; pointer-events: none; }

    /* ── Minimap ── */
    #minimap {
      position: absolute; bottom: 10px; right: 10px; z-index: 20;
      width: 160px; height: 110px;
      background: rgba(15, 17, 23, 0.88);
      border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.45);
      backdrop-filter: blur(6px);
      cursor: crosshair;
    }
    #minimapContent {
      position: absolute; inset: 0; overflow: hidden;
    }
    #minimapContent svg {
      position: absolute;
      pointer-events: none;
    }
    #minimapViewport {
      display: none;
      position: absolute;
      border: 1.5px solid rgba(108, 114, 203, 0.95);
      background: rgba(108, 114, 203, 0.08);
      pointer-events: none;
      /* box-shadow dims everything outside the viewport rect */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.42);
    }

    /* Zoom controls in preview pane-header */
    .zoom-controls { display: flex; align-items: center; gap: 3px; }
    .zoom-btn {
      width: 22px; height: 22px; padding: 0; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 14px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .zoom-btn:hover { background: var(--accent); border-color: var(--accent); }
    #zoomLabel { font-size: 10px; min-width: 34px; text-align: center; color: var(--text-muted); }

    /* ── Status bar ── */
    .statusbar {
      height: 22px; display: flex; align-items: center; padding: 0 10px;
      font-size: 10px; color: var(--text-muted); border-top: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0; gap: 14px;
    }
    .statusbar .err { color: var(--red); }

    /* ── Toast ── */
    .toast {
      position: fixed; top: 50px; right: 16px; padding: 8px 14px; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 12px; z-index: 999;
      opacity: 0; transform: translateY(-8px); transition: all .25s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Collaboration workbench ── */
    .status #btnCollaborate, .collab-actions button, .collab-header button {
      height: 24px; padding: 0 9px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 11px; cursor: pointer;
    }
    .status #btnCollaborate { margin-right: 8px; }
    .collab-shell {
      position: fixed; inset: 48px 12px 12px 12px; z-index: 500;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 16px 60px rgba(0,0,0,.55); display: flex; flex-direction: column;
    }
    .collab-shell[hidden] { display: none; }
    .collab-header {
      height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; border-bottom: 1px solid var(--border);
    }
    .collab-header span { margin-left: 12px; font-size: 11px; color: var(--text-muted); }
    .collab-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.1fr 1fr 1fr; }
    .collab-section { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); padding: 12px; }
    .collab-section:last-child { border-right: 0; }
    .collab-section h3 { font-size: 12px; margin-bottom: 6px; }
    .collab-help { font-size: 10px; color: var(--text-muted); line-height: 1.5; margin-bottom: 8px; }
    .collab-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .collab-actions button:hover { background: var(--accent); }
    .graph-editor, .chat-log, .proposal-list {
      flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg); padding: 8px;
    }
    .graph-row {
      display: grid; grid-template-columns: 18px 1fr .8fr 24px; gap: 4px; padding: 5px;
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .graph-row.selected { background: rgba(88, 166, 255, .12); }
    .graph-row input, .graph-row select, .edge-row input, .edge-row select {
      min-width: 0; background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 3px; padding: 4px; font-size: 10px; box-sizing: border-box;
    }
    .graph-row button, .edge-row button {
      width: 22px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 3px;
      background: var(--bg); color: var(--text-muted); cursor: pointer; font-size: 11px;
    }
    .graph-row button:hover, .edge-row button:hover { color: var(--red); border-color: var(--red); }
    .edge-row { display: grid; grid-template-columns: 1fr 1fr .7fr 24px; gap: 4px; padding: 4px 5px; border-bottom: 1px solid var(--border); align-items: center; }
    .edge-editor { margin-top: 8px; border-top: 1px solid var(--border); }
    .edge-editor h4 { font-size: 10px; color: var(--text-muted); margin: 8px 0 4px; }
    .graph-empty { color: var(--text-muted); font-size: 10px; padding: 8px 0; }
    .chat-item { padding: 6px 8px; margin-bottom: 6px; border-radius: 5px; background: var(--surface2); font-size: 11px; line-height: 1.45; }
    .chat-item .meta { display: block; color: var(--text-muted); font-size: 9px; margin-bottom: 3px; }
    .chat-item.human { border-left: 2px solid var(--green); }
    .chat-item.ai { border-left: 2px solid var(--accent); }
    .chat-item.pending { box-shadow: inset 0 0 0 1px var(--orange); }
    .proposal-card { padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); }
    .proposal-card h4 { font-size: 11px; margin-bottom: 4px; }
    .proposal-card p { font-size: 10px; color: var(--text-muted); line-height: 1.5; margin-bottom: 6px; }
    .proposal-card .status { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; background: var(--bg); margin-bottom: 6px; }
    .proposal-card button { height: 22px; padding: 0 8px; margin-right: 4px; font-size: 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
    .proposal-card button.approve { border-color: var(--green); color: #9be29f; }
    .proposal-card button.reject { border-color: var(--red); color: #ff9b95; }
    .proposal-diff { margin: 6px 0; max-height: 150px; overflow: auto; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); font: 10px/1.4 'JetBrains Mono', Consolas, monospace; }
    .proposal-diff summary { cursor: pointer; padding: 5px 7px; color: var(--text-muted); }
    .proposal-diff pre { margin: 0; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
    .diff-line.add { color: #9be29f; }
    .diff-line.remove { color: #ff9b95; }
    .diff-line.context { color: var(--text-muted); }
    .annotation-resolved { opacity: .55; text-decoration: line-through; }
    .collab-section textarea, .collab-section > input {
      width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); color: var(--text); padding: 8px; font: inherit; font-size: 11px;
    }
    .collab-section textarea { height: 64px; resize: none; }
    .collab-section > input { margin-bottom: 6px; }
    @media (max-width: 900px) { .collab-body { grid-template-columns: 1fr; overflow: auto; } .collab-section { min-height: 300px; } }

    /* toggle sidebar */
    .sidebar.collapsed { width: 0; overflow: hidden; border: none; }
    #selTheme:disabled { opacity: 0.45; cursor: not-allowed; }
    .badge-mode { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--surface2); color: var(--accent2); margin-left: 6px; }
  </style>
</head>
<body>

<div class="header">
  <span class="brand">AI Draw MCP</span>
  <div class="toolbar">
    <button class="btn-icon" id="btnToggleSidebar" title="Toggle sidebar">☰</button>
    <select id="selTheme">
      <option value="default">Default</option>
      <option value="dark">Dark</option>
      <option value="forest">Forest</option>
      <option value="neutral">Neutral</option>
    </select>
    <button id="btnRender">▶ Render</button>
    <button id="btnExportSvg">↓ SVG</button>
    <button id="btnExportPng">↓ PNG</button>
    <button id="btnCopyId" type="button" title="复制当前图 ID">📋 ID</button>
    <button id="btnDeleteDiagram" type="button" title="从本机删除当前图">🗑 删当前</button>
    <button class="btn-icon" id="btnDarkBg" title="Toggle preview background">◐</button>
  </div>
  <div class="status">
    <button id="btnCollaborate" title="打开双向协作工作台">💬 协作</button>
    <span class="dot" id="wsStatus"></span>
    <span id="wsLabel">Connecting...</span>
  </div>
</div>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">Diagrams</div>
    <div class="sidebar-list" id="diagramList"></div>
    <div class="sidebar-resize" id="sidebarResize"></div>
  </aside>

  <div class="workspace">
    <div class="panes">
      <div class="pane" id="editorPane">
        <div class="pane-header">
          <span><span id="editorModeLabel">Mermaid</span> · 源码</span>
          <span id="charCount">0 chars</span>
        </div>
        <div class="editor-wrap">
          <textarea id="codeEditor" spellcheck="false" placeholder="Enter Mermaid DSL here...&#10;&#10;Example:&#10;graph TD&#10;  A[Start] --> B{Decision}&#10;  B -->|Yes| C[OK]&#10;  B -->|No| D[Retry]"></textarea>
        </div>
      </div>
      <div class="divider" id="divider"></div>
      <div class="pane" id="previewPane">
        <div class="pane-header">
          <span>Preview</span>
          <div class="zoom-controls">
            <button class="zoom-btn" id="btnZoomOut" title="缩小">−</button>
            <span id="zoomLabel">100%</span>
            <button class="zoom-btn" id="btnZoomIn" title="放大">+</button>
            <button class="zoom-btn" id="btnZoomFit" title="适应窗口 (F)">⊡</button>
            <button class="zoom-btn" id="btnZoomReset" title="重置 1:1 (双击画布)">1:1</button>
          </div>
          <span id="diagramTitle">—</span>
        </div>
        <div class="preview-wrap" id="previewWrap">
          <div id="diagramRender"></div>
          <div id="panOverlay"></div>
          <div id="minimap">
            <div id="minimapContent"></div>
            <div id="minimapViewport"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <span id="statusMsg">Ready</span>
      <span id="statusErr"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="collab-shell" id="collabShell" hidden>
  <div class="collab-header">
    <div>
      <strong>双向协作工作台</strong>
      <span id="collabMeta">等待同步…</span>
    </div>
    <button id="btnCloseCollab" title="关闭">✕</button>
  </div>
  <div class="collab-body">
    <section class="collab-section">
      <h3>项目图 · 节点编辑</h3>
      <p class="collab-help">可新增/删除节点与连线；选中节点后批注会绑定到它。保存后 AI 可通过 get_visual_context 读取。</p>
      <div class="graph-editor" id="graphEditor"></div>
      <div class="edge-editor">
        <h4>连线 · from → to / label</h4>
        <div id="edgeEditor" class="graph-editor" style="flex: none; min-height: 60px; max-height: 160px;"></div>
      </div>
      <div class="collab-actions">
        <button id="btnAddNode">＋ 节点</button>
        <button id="btnAddEdge">＋ 连线</button>
        <button id="btnSaveGraph">保存图形</button>
        <button id="btnRescan">重新同步会话</button>
      </div>
    </section>
    <section class="collab-section">
      <h3>对话与批注</h3>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-log" id="annotationList" style="max-height: 120px; margin-top: 8px;"></div>
      <textarea id="messageInput" placeholder="告诉 AI 你想怎样修改项目…"></textarea>
      <div class="collab-actions">
        <button id="btnSendMessage">发送消息</button>
        <button id="btnAddAnnotation">添加图形批注</button>
      </div>
      <input id="annotationInput" placeholder="批注内容；先选中左侧节点即可绑定" />
    </section>
    <section class="collab-section">
      <h3>变更提案 · 人工确认</h3>
      <p class="collab-help">AI 生成提案后，先查看逐行差异；你点击“批准”并把一次性确认号发给 AI，项目文件才会改变。</p>
      <div class="proposal-list" id="proposalList"></div>
    </section>
  </div>
</div>

<script type="module">
const mermaid = window.mermaid;
const PANEL_TOKEN = "__AI_DRAW_PANEL_TOKEN__";

const $ = (s) => document.querySelector(s);
const API = location.origin;
let currentId = null;
let editorKind = 'mermaid'; // 'mermaid' | 'svg'
let renderTimer = null;

// ── Layout Preferences (localStorage) ────────────────────────────
const PREFS_KEY = 'ai-draw:prefs';
const PREFS_DEFAULT = {
  sidebarCollapsed: false,
  sidebarWidth: 200,
  splitPct: 50,          // editor pane width %
  theme: 'default',
  darkBg: false,
  lastDiagramId: null,
};
let prefs = { ...PREFS_DEFAULT };

function loadPrefs() {
  try { prefs = { ...PREFS_DEFAULT, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') }; } catch {}
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
}
function applyPrefs() {
  // Sidebar
  const sidebar = $('#sidebar');
  if (prefs.sidebarCollapsed) {
    sidebar.classList.add('collapsed');
    // No inline width — let CSS .collapsed { width:0 } take effect
  } else {
    const w = Math.max(120, Math.min(480, prefs.sidebarWidth));
    sidebar.style.width = `${w}px`;
  }
  // Split pane
  const pct = Math.max(15, Math.min(85, prefs.splitPct));
  $('#editorPane').style.flex  = `0 0 ${pct}%`;
  $('#previewPane').style.flex = `0 0 ${100 - pct}%`;
  // Theme
  const themeSel = $('#selTheme');
  if (prefs.theme && themeSel.querySelector(`option[value="${prefs.theme}"]`)) {
    themeSel.value = prefs.theme;
  }
  // Dark background
  if (prefs.darkBg) $('#previewWrap').classList.add('dark-bg');
}

loadPrefs();
// Apply theme before initializing mermaid
mermaid.initialize({ startOnLoad: false, theme: prefs.theme || 'default', securityLevel: 'loose' });
applyPrefs();
// ────────────────────────────────────────────────────────────────

// ── Zoom / Pan ──────────────────────────────────────────────────
let zScale = 1, zX = 0, zY = 0;
let isPanning = false, panStartX = 0, panStartY = 0;

function applyTransform() {
  $('#diagramRender').style.transform = `translate(${zX}px,${zY}px) scale(${zScale})`;
  $('#zoomLabel').textContent = `${Math.round(zScale * 100)}%`;
  scheduleMinimapUpdate();
}

function resetView() { zScale = 1; zX = 0; zY = 0; applyTransform(); }

function fitView() {
  const wrap = $('#previewWrap');
  const render = $('#diagramRender');
  const svg = render.querySelector('svg');
  if (!svg) { resetView(); return; }
  const svgW = svg.getBoundingClientRect().width / zScale;
  const svgH = svg.getBoundingClientRect().height / zScale;
  if (!svgW || !svgH) { resetView(); return; }
  const padW = wrap.clientWidth - 40, padH = wrap.clientHeight - 40;
  const newScale = Math.min(padW / svgW, padH / svgH, 2);
  zScale = Math.max(0.05, newScale);
  zX = (wrap.clientWidth  - svgW * zScale) / 2;
  zY = (wrap.clientHeight - svgH * zScale) / 2;
  applyTransform();
}

const previewWrap = $('#previewWrap');
const panOverlay  = $('#panOverlay');

previewWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const newScale = Math.max(0.05, Math.min(20, zScale * factor));
  const realFactor = newScale / zScale; // 1 when clamped → no pan shift
  if (realFactor === 1) return;
  const rect = previewWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  zX = mx - (mx - zX) * realFactor;
  zY = my - (my - zY) * realFactor;
  zScale = newScale;
  applyTransform();
}, { passive: false });

panOverlay.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isPanning = true;
  panStartX = e.clientX - zX;
  panStartY = e.clientY - zY;
  panOverlay.classList.add('panning');
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  zX = e.clientX - panStartX;
  zY = e.clientY - panStartY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  if (isPanning) { isPanning = false; panOverlay.classList.remove('panning'); }
});

panOverlay.addEventListener('dblclick', () => resetView());

$('#btnZoomIn').addEventListener('click',  () => {
  const c = previewWrap.getBoundingClientRect();
  const cx = c.width / 2, cy = c.height / 2;
  const ns = Math.min(20, zScale * 1.3), rf = ns / zScale;
  zX = cx - (cx - zX) * rf; zY = cy - (cy - zY) * rf; zScale = ns; applyTransform();
});
$('#btnZoomOut').addEventListener('click', () => {
  const c = previewWrap.getBoundingClientRect();
  const cx = c.width / 2, cy = c.height / 2;
  const ns = Math.max(0.05, zScale / 1.3), rf = ns / zScale;
  zX = cx - (cx - zX) * rf; zY = cy - (cy - zY) * rf; zScale = ns; applyTransform();
});

// ── Minimap ──────────────────────────────────────────────────────
// DOM-clone approach: no canvas/blob/CORS issues — works with any SVG
const MM_W = 160, MM_H = 110;
const minimapEl      = document.getElementById('minimap');
const minimapContent = document.getElementById('minimapContent');
const minimapVP      = document.getElementById('minimapViewport');
let mmPending = false;

function getContentMetrics() {
  const svgEl = $('#diagramRender svg');
  if (!svgEl) return null;
  const pad  = 20;
  const svgW = parseFloat(svgEl.getAttribute('width'))  || svgEl.viewBox?.baseVal?.width  || 800;
  const svgH = parseFloat(svgEl.getAttribute('height')) || svgEl.viewBox?.baseVal?.height || 600;
  const contentW = svgW + pad * 2;
  const contentH = svgH + pad * 2;
  const mmScale  = Math.min(MM_W / contentW, MM_H / contentH) * 0.92;
  const offX     = (MM_W - contentW * mmScale) / 2;
  const offY     = (MM_H - contentH * mmScale) / 2;
  return { svgW, svgH, pad, mmScale, offX, offY };
}

function refreshMinimapImage() {
  const svgEl = $('#diagramRender svg');
  minimapContent.innerHTML = '';
  if (!svgEl) { minimapVP.style.display = 'none'; return; }
  const clone = svgEl.cloneNode(true);
  clone.style.position     = 'absolute';
  clone.style.pointerEvents = 'none';
  clone.style.transformOrigin = '0 0';
  minimapContent.appendChild(clone);
  scheduleMinimapUpdate();
}

function renderMinimapNow() {
  mmPending = false;
  const m = getContentMetrics();
  if (!m) { minimapVP.style.display = 'none'; return; }

  // Position the cloned SVG
  const cloneSvg = minimapContent.querySelector('svg');
  if (cloneSvg) {
    cloneSvg.setAttribute('width',  String(m.svgW));
    cloneSvg.setAttribute('height', String(m.svgH));
    cloneSvg.style.left   = `${m.offX + m.pad * m.mmScale}px`;
    cloneSvg.style.top    = `${m.offY + m.pad * m.mmScale}px`;
    cloneSvg.style.width  = `${m.svgW * m.mmScale}px`;
    cloneSvg.style.height = `${m.svgH * m.mmScale}px`;
  }

  // Position the viewport indicator rectangle
  const vpX = -zX / zScale, vpY = -zY / zScale;
  const vpW = previewWrap.clientWidth  / zScale;
  const vpH = previewWrap.clientHeight / zScale;
  const rx = m.offX + vpX * m.mmScale;
  const ry = m.offY + vpY * m.mmScale;
  const rw = Math.max(4, vpW * m.mmScale);
  const rh = Math.max(4, vpH * m.mmScale);

  minimapVP.style.display = 'block';
  minimapVP.style.left    = `${rx}px`;
  minimapVP.style.top     = `${ry}px`;
  minimapVP.style.width   = `${rw}px`;
  minimapVP.style.height  = `${rh}px`;
}

function scheduleMinimapUpdate() {
  if (mmPending) return;
  mmPending = true;
  requestAnimationFrame(() => { mmPending = false; renderMinimapNow(); });
}

// Click / drag on minimap → navigate
let mmDragging = false;
function minimapNavTo(clientX, clientY) {
  const m = getContentMetrics();
  if (!m) return;
  const rect   = minimapEl.getBoundingClientRect();
  const diagX  = (clientX - rect.left - m.offX) / m.mmScale;
  const diagY  = (clientY - rect.top  - m.offY) / m.mmScale;
  zX = previewWrap.clientWidth  / 2 - diagX * zScale;
  zY = previewWrap.clientHeight / 2 - diagY * zScale;
  applyTransform();
}
minimapEl.addEventListener('mousedown', (e) => { e.stopPropagation(); mmDragging = true; minimapNavTo(e.clientX, e.clientY); });
window.addEventListener('mousemove',  (e) => { if (mmDragging) minimapNavTo(e.clientX, e.clientY); });
window.addEventListener('mouseup',    ()  => { mmDragging = false; });

// ── Mermaid render ──
async function renderDiagram(code, keepView = false) {
  const container = $('#diagramRender');
  if (!code || !code.trim()) { container.innerHTML = '<p style="color:#999">Enter Mermaid code to preview</p>'; return; }
  try {
    const { svg } = await mermaid.render('mmd-' + Date.now(), code);
    container.innerHTML = svg;
    // Ensure SVG stays vector-sharp at any zoom level:
    // preserve natural size in viewBox, then let CSS transform handle scaling.
    const svgEl = container.querySelector('svg');
    if (svgEl) {
      const w = parseFloat(svgEl.getAttribute('width'))  || svgEl.viewBox?.baseVal?.width  || 0;
      const h = parseFloat(svgEl.getAttribute('height')) || svgEl.viewBox?.baseVal?.height || 0;
      if (w && h && !svgEl.getAttribute('viewBox')) {
        svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }
      // Keep explicit px dimensions so getBoundingClientRect works for fitView
      if (w) svgEl.setAttribute('width',  String(w));
      if (h) svgEl.setAttribute('height', String(h));
      svgEl.style.maxWidth = 'none';
    }
    $('#statusErr').textContent = '';
    $('#statusMsg').textContent = `Mermaid · ${new Date().toLocaleTimeString()}`;
    if (!keepView) fitView();
    refreshMinimapImage();
  } catch (e) {
    $('#statusErr').textContent = `Error: ${e.message?.slice(0, 120) ?? e}`;
    $('#statusErr').className = 'err';
  }
}

function renderSvgPreview(raw, keepView = false) {
  const container = $('#diagramRender');
  const t = (raw || '').trim();
  if (!t) { container.innerHTML = '<p style="color:#999">Enter SVG markup</p>'; return; }
  try {
    if (t.includes('<svg')) {
      container.innerHTML = t;
    } else {
      container.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">${t}</svg>`;
    }
    $('#statusErr').textContent = '';
    $('#statusMsg').textContent = `SVG · ${new Date().toLocaleTimeString()}`;
    if (!keepView) fitView();
    refreshMinimapImage();
  } catch (e) {
    $('#statusErr').textContent = `SVG parse: ${e.message?.slice(0, 120) ?? e}`;
    $('#statusErr').className = 'err';
  }
}

function renderPreview() {
  const code = $('#codeEditor').value;

  if (editorKind === 'svg') renderSvgPreview(code, true);

}

$('#btnExportPng').addEventListener('click', async () => {
  const svgEl = $('#diagramRender svg');
  if (!svgEl) return;
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width * 2; canvas.height = img.height * 2;
    ctx.scale(2, 2);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(blob => download(blob, `diagram-${currentId || 'untitled'}.png`), 'image/png');
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function loadList() {
  try {
    const res = await fetch(`${API}/api/diagrams`);
    const diagrams = await res.json();
    const list = $('#diagramList');
    list.innerHTML = '';
    for (const d of diagrams) {
      const el = document.createElement('div');
      el.className = 'sidebar-item' + (d.id === currentId ? ' active' : '');
      el.innerHTML = `<div class="name">${d.title}</div><div class="meta"><span class="badge">${d.type}</span>${new Date(d.createdAt).toLocaleTimeString()}</div>`;
      el.onclick = () => loadDiagram(d.id);
      list.appendChild(el);
    }
  } catch {}
}

async function loadDiagram(id) {
  currentId = id;
  prefs.lastDiagramId = id;
  savePrefs();
  try {
    const res = await fetch(`${API}/api/diagram/${id}`);
    const data = await res.json();
    const kind = data.editorKind === 'svg' ? 'svg' : 'mermaid';
    setEditorKind(kind);
    $('#diagramTitle').textContent = data.title || id;

    if (kind === 'mermaid' && data.mermaidCode != null) {
      $('#codeEditor').value = data.mermaidCode;
      $('#charCount').textContent = `${data.mermaidCode.length} chars`;
      renderDiagram(data.mermaidCode);
    } else {
      const svgRes = await fetch(`${API}/api/diagram/${id}/svg`);
      const svgText = await svgRes.text();
      $('#codeEditor').value = svgText;
      $('#charCount').textContent = `${svgText.length} chars`;
      renderSvgPreview(svgText);
    }
    loadList();
  } catch {}
}

async function saveCurrent() {
  if (!currentId) return;
  const code = $('#codeEditor').value;
  try {
    const body =
      editorKind === 'svg' ? { svgContent: code } : { mermaidCode: code };
    const r = await fetch(`${API}/api/diagram/${currentId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      showToast(j.error || `Save failed ${r.status}`);
      return;
    }
    showToast('Saved');
  } catch {}
}

$('#codeEditor').addEventListener('keydown', (e) => {

});

// ── WebSocket — live updates from AI ──
function connectWs() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  const dot = $('#wsStatus');
  const label = $('#wsLabel');

  ws.onopen = () => { dot.classList.remove('offline'); label.textContent = 'Live'; };
  ws.onclose = () => { dot.classList.add('offline'); label.textContent = 'Offline'; setTimeout(connectWs, 3000); };

  ws.onmessage = async (e) => {
    try {
      const msg = JSON.parse(e.data);

      if (msg.type === 'diagram_removed') {
        if (currentId === msg.id) {
          currentId = null;
          $('#diagramTitle').textContent = '—';
          $('#codeEditor').value = '';
          $('#diagramRender').innerHTML = '';
        }
        showToast(`已删除: ${msg.id}`);
        loadList();
        return;
      }

      if (msg.type === 'diagram_update' || msg.type === 'diagram_added') {
        currentId = msg.id;
        if (msg.title) $('#diagramTitle').textContent = msg.title;
        if (msg.mermaidCode && String(msg.mermaidCode).trim()) {
          setEditorKind('mermaid');
          $('#codeEditor').value = msg.mermaidCode;
          $('#charCount').textContent = `${msg.mermaidCode.length} chars`;
          renderDiagram(msg.mermaidCode);
        } else {
          await loadDiagram(msg.id);
        }
        showToast(msg.type === 'diagram_added' ? `New: ${msg.title}` : `Updated: ${msg.title}`);
        loadList();
      }

      if (['graph_updated', 'chat_message', 'proposal_created', 'proposal_updated', 'session_updated'].includes(msg.type)
          && !$('#collabShell').hidden) {
        await loadCollab();
      }
    } catch {}
  };
}

let collabGraph = null;
let collabRevision = 0;
let selectedNodeId = null;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

async function collabFetch(url, options = {}) {
  const response = await fetch(`${API}${url}`, {
    headers: {
      'Content-Type': 'application/json',
      'X-AI-Draw-Token': PANEL_TOKEN,
    },
    ...options,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

function renderGraphEditor() {
  const target = $('#graphEditor');
  const edgeTarget = $('#edgeEditor');
  if (!collabGraph) {
    target.innerHTML = '<div class="collab-help">暂无项目结构图。让 AI 调用 scan_project，或刷新协作会话。</div>';
    edgeTarget.innerHTML = '<div class="graph-empty">暂无连线。</div>';
    return;
  }
  if (!collabGraph.nodes.some((node) => node.id === selectedNodeId)) selectedNodeId = null;
  target.innerHTML = collabGraph.nodes.map((node, index) => `
    <div class="graph-row ${node.id === selectedNodeId ? 'selected' : ''}" data-index="${index}" data-node-id="${escapeHtml(node.id)}">
      <input type="radio" name="selectedNode" ${node.id === selectedNodeId ? 'checked' : ''} aria-label="选中节点" />
      <input class="node-label" value="${escapeHtml(node.label)}" aria-label="节点名称" />
      <input class="node-kind" value="${escapeHtml(node.kind)}" aria-label="节点类型" />
      <button data-remove-node="${index}" title="删除节点">✕</button>
    </div>
  `).join('');
  const options = (selected) => collabGraph.nodes.map((node) => `<option value="${escapeHtml(node.id)}" ${node.id === selected ? 'selected' : ''}>${escapeHtml(node.label)}</option>`).join('');
  edgeTarget.innerHTML = collabGraph.edges.length ? collabGraph.edges.map((edge, index) => `
    <div class="edge-row" data-index="${index}">
      <select class="edge-from" aria-label="连线起点">${options(edge.from)}</select>
      <select class="edge-to" aria-label="连线终点">${options(edge.to)}</select>
      <input class="edge-label" value="${escapeHtml(edge.label || '')}" aria-label="连线说明" />
      <button data-remove-edge="${index}" title="删除连线">✕</button>
    </div>
  `).join('') : '<div class="graph-empty">暂无连线。新增节点后可描述模块关系。</div>';

  for (const row of target.querySelectorAll('.graph-row')) {
    row.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      selectedNodeId = row.dataset.nodeId;
      renderGraphEditor();
    });
  }
  for (const button of target.querySelectorAll('[data-remove-node]')) {
    button.addEventListener('click', () => removeNode(Number(button.dataset.removeNode)));
  }
  for (const button of edgeTarget.querySelectorAll('[data-remove-edge]')) {
    button.addEventListener('click', () => removeEdge(Number(button.dataset.removeEdge)));
  }
}

function localId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

function addNode() {
  if (!collabGraph) collabGraph = { version: 1, diagramId: `panel_${Date.now()}`, nodes: [], edges: [], annotations: [] };
  const id = localId('node');
  collabGraph.nodes.push({ id, label: '新节点', kind: 'module', group: 'human' });
  selectedNodeId = id;
  renderGraphEditor();
  $('#graphEditor').scrollTop = $('#graphEditor').scrollHeight;
}

function removeNode(index) {
  const node = collabGraph?.nodes[index];
  if (!node) return;
  collabGraph.nodes.splice(index, 1);
  collabGraph.edges = collabGraph.edges.filter((edge) => edge.from !== node.id && edge.to !== node.id);
  collabGraph.annotations = collabGraph.annotations.map((annotation) =>
    annotation.nodeId === node.id ? { ...annotation, nodeId: undefined } : annotation);
  if (selectedNodeId === node.id) selectedNodeId = null;
  renderGraphEditor();
}

function addEdge() {
  if (!collabGraph || collabGraph.nodes.length < 2) return showToast('至少需要两个节点才能建立连线');
  const [from, to] = collabGraph.nodes.slice(-2).map((node) => node.id);
  collabGraph.edges.push({ id: localId('edge'), from, to, label: 'relates', kind: 'human' });
  renderGraphEditor();
  $('#edgeEditor').scrollTop = $('#edgeEditor').scrollHeight;
}

function removeEdge(index) {
  collabGraph?.edges.splice(index, 1);
  renderGraphEditor();
}

function renderChat(messages) {
  $('#chatLog').innerHTML = messages.map((message) => `
    <div class="chat-item ${message.author} ${message.status || ''}">

      ${escapeHtml(message.body)}

function renderAnnotations(annotations) {
  const target = $('#annotationList');

    <div class="chat-item human ${annotation.resolved ? 'annotation-resolved' : ''}">

      ${escapeHtml(annotation.body)}

  `).join('') : '<div class="collab-help">暂无批注。</div>';
}

function renderProposals(proposals) {
  $('#proposalList').innerHTML = proposals.length ? [...proposals].reverse().map((proposal) => `
    <div class="proposal-card">
      <h4>${escapeHtml(proposal.title)}</h4>
      <span class="status">${escapeHtml(proposal.status)} · ${proposal.changes.length} changes</span>
      <p>${escapeHtml(proposal.summary)}</p>
      <div>${proposal.changes.map((change) => `<code>${escapeHtml(change.kind)}:${escapeHtml(change.path)}</code>`).join('<br>')}</div>
      <details class="proposal-diff" data-diff="${escapeHtml(proposal.id)}">
        <summary>查看逐行差异</summary>
        <pre>加载中…</pre>
      </details>
      <div class="collab-actions">
        ${proposal.status === 'pending'
          ? `<button class="approve" data-approve="${escapeHtml(proposal.id)}">批准</button>
             <button class="reject" data-reject="${escapeHtml(proposal.id)}">拒绝</button>`
          : ''}
      </div>
      ${proposal.error ? `<p style="color:var(--red)">${escapeHtml(proposal.error)}</p>` : ''}
    </div>
  `).join('') : '<div class="collab-help">暂无提案。AI 会先通过 get_visual_context 理解你的意图。</div>';

  for (const button of $('#proposalList').querySelectorAll('[data-approve]')) {
    button.addEventListener('click', () => decideProposal(button.dataset.approve, 'approve'));
  }
  for (const button of $('#proposalList').querySelectorAll('[data-reject]')) {
    button.addEventListener('click', () => decideProposal(button.dataset.reject, 'reject'));
  }
  for (const details of $('#proposalList').querySelectorAll('[data-diff]')) {
    details.addEventListener('toggle', async () => {
      if (!details.open || details.dataset.loaded) return;
      try {
        const data = await collabFetch(`/api/collab/proposals/${encodeURIComponent(details.dataset.diff)}/diff`);
        details.querySelector('pre').innerHTML = data.diffs.map((diff) => [
          `<strong>${escapeHtml(diff.kind)} ${escapeHtml(diff.path)}</strong>`,
          ...diff.lines.map((line) => `<span class="diff-line ${line.type}">${line.type === 'add' ? '+' : line.type === 'remove' ? '-' : ' '} ${escapeHtml(line.text)}</span>`),
          diff.truncated ? '<span class="diff-line context">… diff truncated …</span>' : '',
        ].join('\n')).join('\n\n') || '暂无差异';
        details.dataset.loaded = 'true';
      } catch (error) {
        details.querySelector('pre').textContent = `差异加载失败：${error.message}`;
      }
    });
  }
}

async function loadCollab() {
  try {
    const session = await collabFetch('/api/collab/session');
    collabRevision = session.graphRevision;
    collabGraph = session.graph || null;
    $('#collabMeta').textContent = `session ${session.id} · revision ${session.graphRevision} · ${session.workspaceRoot}`;
    renderGraphEditor();
    renderChat(session.messages || []);
    renderAnnotations(session.graph?.annotations || []);
    const proposals = await collabFetch('/api/collab/proposals');
    renderProposals(proposals.proposals || []);
  } catch (error) {
    $('#collabMeta').textContent = `同步失败：${error.message}`;
  }
}

async function saveGraph() {
  if (!collabGraph) return showToast('没有可保存的图形');
  const rows = [...$('#graphEditor').querySelectorAll('.graph-row')];
  rows.forEach((row, index) => {
    const node = collabGraph.nodes[index];
    if (!node) return;
    node.label = row.querySelector('.node-label').value.trim() || node.label;
    node.kind = row.querySelector('.node-kind').value.trim() || node.kind;
  });
  const edgeRows = [...$('#edgeEditor').querySelectorAll('.edge-row')];
  edgeRows.forEach((row, index) => {
    const edge = collabGraph.edges[index];
    if (!edge) return;
    edge.from = row.querySelector('.edge-from').value;
    edge.to = row.querySelector('.edge-to').value;
    edge.label = row.querySelector('.edge-label').value.trim() || undefined;
  });
  try {
    const result = await collabFetch('/api/collab/graph', {
      method: 'PUT',
      body: JSON.stringify(collabGraph),
    });
    collabRevision = result.graphRevision;
    showToast(`图形已保存 · revision ${collabRevision}`);
    await loadCollab();
  } catch (error) {
    showToast(`保存失败：${error.message}`);
  }
}

async function sendMessage() {
  const input = $('#messageInput');
  const body = input.value.trim();
  if (!body) return;
  input.value = '';
  try {
    await collabFetch('/api/collab/messages', {
      method: 'POST',
      body: JSON.stringify({ body, author: 'human', diagramId: currentId || undefined }),
    });
    showToast('消息已发送，等待 AI 读取');
    await loadCollab();
  } catch (error) {
    showToast(`发送失败：${error.message}`);
  }
}

async function addAnnotation() {
  const input = $('#annotationInput');
  const body = input.value.trim();
  if (!body) return showToast('请输入批注内容');
  input.value = '';
  try {
    const nodeId = selectedNodeId || undefined;
    await collabFetch('/api/collab/annotations', {
      method: 'POST',
      body: JSON.stringify({ body, nodeId }),
    });
    showToast(nodeId ? '批注已绑定到选中节点' : '批注已加入图形');
    await loadCollab();
  } catch (error) {
    showToast(`批注失败：${error.message}`);
  }
}

async function decideProposal(id, decision) {
  if (decision === 'approve' && !confirm('确认批准该提案？批准后还需在 AI 对话中提供一次性确认号，项目文件才会改变。')) return;
  try {
    const result = await collabFetch(`/api/collab/proposals/${encodeURIComponent(id)}/${decision}`, {
      method: 'POST',
      body: JSON.stringify({ approvedBy: 'human' }),
    });
    if (decision === 'approve' && result.receipt) {
      const grant = [
        `提案已批准。请把以下信息发给 AI，让它调用 apply_visual_proposal：`,
        `proposal_id: ${result.receipt.proposalId}`,
        `approval_id: ${result.receipt.approvalId}`,
        `approval_grant: ${result.receipt.grantHash}`,
        `approval_expires_at: ${result.receipt.expiresAt}`,
      ].join('\n');
      await navigator.clipboard?.writeText(grant).catch(() => {});
      alert(grant);
      showToast('确认号已复制，请发给 AI');
    } else {
      showToast(decision === 'approve' ? '提案已批准' : '提案已拒绝');
    }
    await loadCollab();
  } catch (error) {
    showToast(`操作失败：${error.message}`);
  }
}

$('#btnCollaborate').addEventListener('click', () => {
  $('#collabShell').hidden = false;
  loadCollab();
});
$('#btnCloseCollab').addEventListener('click', () => { $('#collabShell').hidden = true; });
$('#btnSaveGraph').addEventListener('click', saveGraph);
$('#btnRescan').addEventListener('click', loadCollab);
$('#btnAddNode').addEventListener('click', addNode);
$('#btnAddEdge').addEventListener('click', addEdge);
$('#btnSendMessage').addEventListener('click', sendMessage);
$('#messageInput').addEventListener('keydown', (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') sendMessage();
});
$('#btnAddAnnotation').addEventListener('click', addAnnotation);

// ── Init ──
loadList();
connectWs();

// Restore last viewed diagram (URL path takes priority)
const pathMatch = location.pathname.match(/\/diagram\/(.+)/);
if (pathMatch) {
  loadDiagram(pathMatch[1]);
} else if (prefs.lastDiagramId) {
  loadDiagram(prefs.lastDiagramId);
}
</script>
