name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install headless Chrome for Mermaid rendering
        run: npx puppeteer browsers install chrome-headless-shell
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:examples
      - run: npm run test:examples:workflow
      - run: npm run docs:assets:check
      - run: npm run repo:check
      - run: npm run doctor
      - run: npm pack --dry-run
