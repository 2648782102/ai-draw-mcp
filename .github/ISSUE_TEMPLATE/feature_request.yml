name: Feature request
description: Suggest a capability for human-AI visual collaboration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe both the human side and the AI/MCP side.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: safety
    attributes:
      label: Safety boundary
      description: Does this change tool discovery, persisted state, approval receipts, project writes, absolute paths, or a read-only JSON projection?
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Which MCP/panel/domain/offline checks should prove the human and AI sides stay aligned?
