name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先运行 `npm run doctor`，并把输出中不含敏感信息的部分贴出来。
        如果问题发生在双向协作面板中，可在面板导出 `ai-draw-session-*.json`；它包含图形、批注线程与提案状态，但不包含一次性批准凭据。
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: ide
    attributes:
      label: MCP host
      options:
        - Cursor
        - VS Code
        - Windsurf
        - Trae
        - Zed
        - Claude Desktop
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did you or the AI do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: stderr logs, browser console, and doctor output
      render: shell
  - type: textarea
    id: session_bundle
    attributes:
      label: Collaboration session bundle (optional)
      description: Paste a redacted exported bundle, or describe which annotation thread / proposal / graph revision is affected.
      render: json
